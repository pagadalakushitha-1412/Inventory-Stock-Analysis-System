
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Inventory System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard') }}">
            StockWise
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a class="nav-link" href="{{ url_for('products') }}">
                    Products
                </a>

                <a class="nav-link" href="{{ url_for('suppliers') }}">
                    Suppliers
                </a>

                <a class="nav-link" href="{{ url_for('transactions') }}">
                    Transactions
                </a>

                <a class="nav-link" href="{{ url_for('reports') }}">
                    Reports
                </a>

            </div>
        </div>
    </div>
</nav>

<main class="container py-4">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">

                {{ message }}

                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>

            </div>

        {% endfor %}

    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer class="container py-4 text-secondary small">
    Inventory and Stock Analysis System · Educational project
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
